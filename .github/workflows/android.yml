name: Build Android APK - CartCue Amazon IAP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CartCue
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Build Next.js app
        run: npm run build

      - name: Add Capacitor Android
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Download Amazon Appstore SDK from Maven Central
        run: |
          mkdir -p android/app/libs
          curl -fsSL "https://repo1.maven.org/maven2/com/amazon/device/amazon-appstore-sdk/3.0.9/amazon-appstore-sdk-3.0.9.jar" -o android/app/libs/amazon-appstore-sdk-3.0.9.jar
          python3 -c "import pathlib,zipfile,sys; p=pathlib.Path('android/app/libs/amazon-appstore-sdk-3.0.9.jar'); print('size', p.stat().st_size); assert p.stat().st_size>100000; assert zipfile.is_zipfile(p); assert any('PurchasingService' in n for n in zipfile.ZipFile(p).namelist()); print('Amazon Appstore SDK 3.0.9 OK')"

      - name: Install Amazon authentication key
        run: |
          mkdir -p android/app/src/main/assets
          cp amazon-iap/AppstoreAuthenticationKey.pem android/app/src/main/assets/AppstoreAuthenticationKey.pem

      - name: Install CartCue Amazon IAP plugin
        run: |
          mkdir -p android/app/src/main/java/com/cartcue/app
          cp amazon-iap/AmazonIAPPlugin.java android/app/src/main/java/com/cartcue/app/AmazonIAPPlugin.java
          cp amazon-iap/MainActivity.java android/app/src/main/java/com/cartcue/app/MainActivity.java

      - name: Add Amazon SDK to Gradle
        run: |
          python3 -c "
          from pathlib import Path
          path = Path('android/app/build.gradle')
          text = path.read_text()
          dep_maven = \"    implementation 'com.amazon.device:amazon-appstore-sdk:3.0.9'\"
          dep_files = \"    implementation files('libs/amazon-appstore-sdk-3.0.9.jar')\"
          if 'com.amazon.device:amazon-appstore-sdk' not in text:
              if 'dependencies {' not in text:
                  raise SystemExit('Could not find dependencies block.')
              text = text.replace('dependencies {', 'dependencies {\n' + dep_maven + '\n' + dep_files, 1)
              path.write_text(text)
          print(path.read_text())
          "

      - name: Patch Android manifest for Amazon IAP
        run: |
          python3 -c "
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          permission = '<uses-permission android:name=\"com.amazon.inapp.purchasing.Permission.NOTIFY\" />'
          queries = '''<queries>
                  <package android:name=\"com.amazon.venezia\" />
              </queries>'''
          receiver = '''<receiver
                  android:name=\"com.amazon.device.iap.ResponseReceiver\"
                  android:exported=\"true\"
                  android:permission=\"com.amazon.inapp.purchasing.Permission.NOTIFY\">
                  <intent-filter>
                      <action android:name=\"com.amazon.inapp.purchasing.NOTIFY\" />
                  </intent-filter>
              </receiver>'''
          if permission not in text:
              text = text.replace('<application', permission + '\n\n    <application', 1)
          if 'package android:name=\"com.amazon.venezia\"' not in text:
              text = text.replace('<application', queries + '\n\n    <application', 1)
          if 'com.amazon.device.iap.ResponseReceiver' not in text:
              text = text.replace('</application>', '    ' + receiver + '\n\n    </application>', 1)
          path.write_text(text)
          print(path.read_text())
          "

      - name: Check Amazon files
        run: |
          test -f android/app/src/main/java/com/cartcue/app/AmazonIAPPlugin.java
          test -f android/app/src/main/java/com/cartcue/app/MainActivity.java
          test -f android/app/libs/amazon-appstore-sdk-3.0.9.jar
          test -f android/app/src/main/assets/AppstoreAuthenticationKey.pem

      - name: Verify Amazon ResponseReceiver
        run: grep -q "com.amazon.device.iap.ResponseReceiver" android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cartcue-amazon-iap-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
