name: Build Android APK - CartCue Amazon IAP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/cli@6.1.2 --save-dev

      - name: Prepare webDir
        run: mkdir -p public

      - name: Add Android platform
        run: |
          echo "Checking for cap binary..."
          ls -la node_modules/.bin/ || true
          npx --yes @capacitor/cli@6.1.2 add android

      - name: Sync
        run: npx --yes @capacitor/cli@6.1.2 sync android

      - name: Download Amazon SDK
        run: |
          mkdir -p android/app/libs
          curl -fsSL https://repo1.maven.org/maven2/com/amazon/device/amazon-appstore-sdk/3.0.9/amazon-appstore-sdk-3.0.9.jar -o android/app/libs/amazon-appstore-sdk-3.0.9.jar

      - name: Copy Amazon files
        run: |
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/java/com/cartcue/app
          cp amazon-iap/AppstoreAuthenticationKey.pem android/app/src/main/assets/
          cp amazon-iap/AmazonIAPPlugin.java android/app/src/main/java/com/cartcue/app/
          cp amazon-iap/MainActivity.java android/app/src/main/java/com/cartcue/app/

      - name: Patch Gradle
        run: |
          if ! grep -q "amazon-appstore-sdk" android/app/build.gradle; then
            sed -i "/dependencies {/a\    implementation 'com.amazon.device:amazon-appstore-sdk:3.0.9'" android/app/build.gradle
          fi

      - name: Patch Manifest
        run: |
          if ! grep -q "com.amazon.inapp.purchasing.Permission.NOTIFY" android/app/src/main/AndroidManifest.xml; then
            sed -i 's|<application|<uses-permission android:name="com.amazon.inapp.purchasing.Permission.NOTIFY" />\n    <application|' android/app/src/main/AndroidManifest.xml
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cartcue-amazon-iap-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
