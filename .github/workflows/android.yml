name: Build Android APK - CartCue Amazon IAP

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Get the CartCue source code
      # --------------------------------------------------

      - name: Checkout CartCue
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Install Node.js
      # --------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v4

        with:
          node-version: 20
          cache: npm


      # --------------------------------------------------
      # 3. Install Java
      # --------------------------------------------------

      - name: Setup Java
        uses: actions/setup-java@v4

        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------------------------
      # 4. Install CartCue dependencies
      # --------------------------------------------------

      - name: Install dependencies
        run: npm install


      # --------------------------------------------------
      # 5. Build the Next.js application
      # --------------------------------------------------

      - name: Build Next.js app
        run: npm run build


      # --------------------------------------------------
      # 6. Create Android project
      # --------------------------------------------------

      - name: Add Capacitor Android
        run: npx cap add android


      # --------------------------------------------------
      # 7. Sync web application into Android
      # --------------------------------------------------

      - name: Sync Capacitor
        run: npx cap sync android


      # --------------------------------------------------
      # 8. Check Amazon SDK exists
      # --------------------------------------------------

      - name: Check Amazon SDK
        run: |
          test -f amazon-iap/amazon-appstore-sdk-3.0.9.jar


      # --------------------------------------------------
      # 9. Check Amazon authentication key exists
      # --------------------------------------------------

      - name: Check Amazon authentication key
        run: |
          test -f amazon-iap/AppstoreAuthenticationKey.pem


      # --------------------------------------------------
      # 10. Install Amazon Appstore SDK
      # --------------------------------------------------

      - name: Install Amazon Appstore SDK
        run: |

          mkdir -p android/app/libs

          cp \
            amazon-iap/amazon-appstore-sdk-3.0.9.jar \
            android/app/libs/amazon-appstore-sdk-3.0.9.jar


      # --------------------------------------------------
      # 11. Install Amazon authentication key
      # --------------------------------------------------

      - name: Install Amazon authentication key
        run: |

          mkdir -p android/app/src/main/assets

          cp \
            amazon-iap/AppstoreAuthenticationKey.pem \
            android/app/src/main/assets/AppstoreAuthenticationKey.pem


      # --------------------------------------------------
      # 12. Install CartCue Amazon IAP Java plugin
      # --------------------------------------------------

      - name: Install CartCue Amazon IAP plugin
        run: |

          mkdir -p \
            android/app/src/main/java/com/cartcue/app

          cp \
            amazon-iap/AmazonIAPPlugin.java \
            android/app/src/main/java/com/cartcue/app/AmazonIAPPlugin.java

          cp \
            amazon-iap/MainActivity.java \
            android/app/src/main/java/com/cartcue/app/MainActivity.java


      # --------------------------------------------------
      # 13. Add Amazon SDK to Gradle
      # --------------------------------------------------

      - name: Add Amazon SDK to Gradle
        shell: bash
        run: |

          BUILD_GRADLE="android/app/build.gradle"

          python3 - <<'PY'

          from pathlib import Path

          path = Path(
              "android/app/build.gradle"
          )

          text = path.read_text()

          dependency = (
              "implementation files("
              "'libs/amazon-appstore-sdk-3.0.9.jar'"
              ")"
          )

          if dependency not in text:

              needle = "dependencies {"

              if needle not in text:
                  raise SystemExit(
                      "Could not find dependencies block in android/app/build.gradle"
                  )

              text = text.replace(
                  needle,
                  needle
                  + "\n    "
                  + dependency,
                  1
              )

              path.write_text(text)

          PY

          cat "$BUILD_GRADLE"


      # --------------------------------------------------
      # 14. Patch Android manifest for Amazon IAP
      # --------------------------------------------------

      - name: Patch Android manifest for Amazon IAP
        shell: bash
        run: |

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - <<'PY'

          from pathlib import Path

          path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = path.read_text()

          permission = (
              '<uses-permission '
              'android:name="com.amazon.inapp.purchasing.Permission.NOTIFY" />'
          )

          queries = """<queries>
              <package android:name="com.amazon.venezia" />
          </queries>"""

          if permission not in text:

              text = text.replace(
                  "<application",
                  permission
                  + "\n\n    <application",
                  1
              )

          if (
              'android:name="com.amazon.venezia"'
              not in text
          ):

              text = text.replace(
                  "<application",
                  queries
                  + "\n\n    <application",
                  1
              )

          path.write_text(text)

          PY

          cat "$MANIFEST"


      # --------------------------------------------------
      # 15. Verify all Amazon files are installed
      # --------------------------------------------------

      - name: Check Android Amazon files
        run: |

          test -f \
            android/app/src/main/java/com/cartcue/app/AmazonIAPPlugin.java

          test -f \
            android/app/src/main/java/com/cartcue/app/MainActivity.java

          test -f \
            android/app/libs/amazon-appstore-sdk-3.0.9.jar

          test -f \
            android/app/src/main/assets/AppstoreAuthenticationKey.pem


      # --------------------------------------------------
      # 16. Build Android APK
      # --------------------------------------------------

      - name: Build debug APK
        run: |

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug


      # --------------------------------------------------
      # 17. Upload APK to GitHub Actions
      # --------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:
          name: cartcue-amazon-iap-debug

          path:
            android/app/build/outputs/apk/debug/app-debug.apk
