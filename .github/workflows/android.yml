name: Build Android APK - CartCue Amazon IAP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm install && npm install @capacitor/cli@6.1.2

      - name: Add Android
        run: npx @capacitor/cli@6.1.2 add android

      - name: Sync
        run: npx @capacitor/cli@6.1.2 sync android

      - name: Amazon SDK
        run: |
          mkdir -p android/app/libs
          curl -fsSL https://repo1.maven.org/maven2/com/amazon/device/amazon-appstore-sdk/3.0.9/amazon-appstore-sdk-3.0.9.jar -o android/app/libs/amazon-appstore-sdk-3.0.9.jar

      - name: Copy plugin
        run: |
          mkdir -p android/app/src/main/assets android/app/src/main/java/com/cartcue/app
          cp amazon-iap/AppstoreAuthenticationKey.pem android/app/src/main/assets/
          cp amazon-iap/AmazonIAPPlugin.java android/app/src/main/java/com/cartcue/app/
          cp amazon-iap/MainActivity.java android/app/src/main/java/com/cartcue/app/

      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: cartcue-amazon-iap-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
