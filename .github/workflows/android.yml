name: Build Android APK - CartCue Amazon IAP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout CartCue
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # NODE
      # ---------------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ---------------------------------------------------------
      # JAVA
      # ---------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # INSTALL JAVASCRIPT DEPENDENCIES
      # ---------------------------------------------------------
      - name: Install dependencies
        run: npm install

      # ---------------------------------------------------------
      # BUILD NEXT.JS APP
      # ---------------------------------------------------------
      - name: Build Next.js app
        run: npm run build

      # ---------------------------------------------------------
      # CREATE ANDROID PROJECT
      # ---------------------------------------------------------
      - name: Add Capacitor Android
        run: npx cap add android

      # ---------------------------------------------------------
      # SYNC CAPACITOR
      # ---------------------------------------------------------
      - name: Sync Capacitor
        run: npx cap sync android

      # ---------------------------------------------------------
      # INSTALL AMAZON APPSTORE SDK 3.0.9
      # ---------------------------------------------------------
      - name: Install Amazon Appstore SDK
        run: |
          mkdir -p android/app/libs

          cp amazon-iap/amazon-appstore-sdk-3.0.9.jar \
            android/app/libs/amazon-appstore-sdk-3.0.9.jar

          test -s android/app/libs/amazon-appstore-sdk-3.0.9.jar

      # ---------------------------------------------------------
      # INSTALL AMAZON AUTHENTICATION KEY
      # ---------------------------------------------------------
      - name: Install Amazon authentication key
        run: |
          mkdir -p android/app/src/main/assets

          cp amazon-iap/AppstoreAuthenticationKey.pem \
            android/app/src/main/assets/AppstoreAuthenticationKey.pem

          test -s android/app/src/main/assets/AppstoreAuthenticationKey.pem

      # ---------------------------------------------------------
      # INSTALL CARTCUE AMAZON IAP JAVA PLUGIN
      # ---------------------------------------------------------
      - name: Install CartCue Amazon IAP plugin
        run: |
          mkdir -p android/app/src/main/java/com/cartcue/app

          cp amazon-iap/AmazonIAPPlugin.java \
            android/app/src/main/java/com/cartcue/app/AmazonIAPPlugin.java

          cp amazon-iap/MainActivity.java \
            android/app/src/main/java/com/cartcue/app/MainActivity.java

      # ---------------------------------------------------------
      # ADD AMAZON SDK TO GRADLE
      # ---------------------------------------------------------
      - name: Add Amazon SDK to Gradle
        shell: bash
        run: |
          BUILD_GRADLE="android/app/build.gradle"

          if ! grep -q \
            "amazon-appstore-sdk-3.0.9.jar" \
            "$BUILD_GRADLE"
          then

            python3 - <<'PY'
from pathlib import Path

path = Path("android/app/build.gradle")
text = path.read_text()

needle = "dependencies {"

if needle not in text:
    raise SystemExit(
        "Could not find dependencies block in android/app/build.gradle"
    )

replacement = (
    needle
    + "\n"
    + "    implementation files('libs/amazon-appstore-sdk-3.0.9.jar')"
)

text = text.replace(
    needle,
    replacement,
    1
)

path.write_text(text)
PY

          fi

          echo "===== android/app/build.gradle ====="
          cat "$BUILD_GRADLE"

      # ---------------------------------------------------------
      # PATCH ANDROID MANIFEST FOR AMAZON IAP
      # ---------------------------------------------------------
      - name: Patch Android manifest for Amazon IAP
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - <<'PY'
from pathlib import Path

path = Path(
    "android/app/src/main/AndroidManifest.xml"
)

text = path.read_text()

# ---------------------------------------------------------
# AMAZON IAP NOTIFICATION PERMISSION
# ---------------------------------------------------------

permission = (
    '<uses-permission '
    'android:name="com.amazon.inapp.purchasing.Permission.NOTIFY" />'
)

if permission not in text:
    text = text.replace(
        "<application",
        permission + "\n\n    <application",
        1
    )

# ---------------------------------------------------------
# AMAZON APPSTORE PACKAGE QUERIES
# ---------------------------------------------------------

queries_block = """<queries>
        <package android:name="com.amazon.venezia" />
        <package android:name="com.amazon.sdktestclient" />
    </queries>"""

if "<package android:name=\"com.amazon.venezia\"" not in text:
    text = text.replace(
        "<application",
        queries_block + "\n\n    <application",
        1
    )
elif "<package android:name=\"com.amazon.sdktestclient\"" not in text:
    text = text.replace(
        "</queries>",
        '        <package android:name="com.amazon.sdktestclient" />\n    </queries>',
        1
    )

# ---------------------------------------------------------
# AMAZON RESPONSE RECEIVER
# ---------------------------------------------------------

receiver = """<receiver
        android:name="com.amazon.device.iap.ResponseReceiver"
        android:exported="true"
        android:permission="com.amazon.inapp.purchasing.Permission.NOTIFY">
        <intent-filter>
            <action android:name="com.amazon.inapp.purchasing.NOTIFY" />
        </intent-filter>
    </receiver>"""

if "com.amazon.device.iap.ResponseReceiver" not in text:
    text = text.replace(
        "</application>",
        "        " + receiver + "\n    </application>",
        1
    )

path.write_text(text)
PY

          echo "===== AndroidManifest.xml ====="
          cat "$MANIFEST"

      # ---------------------------------------------------------
      # VERIFY REQUIRED AMAZON FILES
      # ---------------------------------------------------------
      - name: Check Amazon IAP files
        run: |
          test -f android/app/src/main/java/com/cartcue/app/AmazonIAPPlugin.java
          test -f android/app/src/main/java/com/cartcue/app/MainActivity.java
          test -s android/app/libs/amazon-appstore-sdk-3.0.9.jar
          test -s android/app/src/main/assets/AppstoreAuthenticationKey.pem

          echo "Amazon IAP files verified."

      # ---------------------------------------------------------
      # VERIFY AMAZON MANIFEST
      # ---------------------------------------------------------
      - name: Check Amazon IAP manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          grep -q \
            "com.amazon.inapp.purchasing.Permission.NOTIFY" \
            "$MANIFEST"

          grep -q \
            "com.amazon.venezia" \
            "$MANIFEST"

          grep -q \
            "com.amazon.sdktestclient" \
            "$MANIFEST"

          grep -q \
            "com.amazon.device.iap.ResponseReceiver" \
            "$MANIFEST"

          echo "Amazon IAP manifest configuration verified."

      # ---------------------------------------------------------
      # BUILD DEBUG APK
      # ---------------------------------------------------------
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # ---------------------------------------------------------
      # VERIFY APK EXISTS
      # ---------------------------------------------------------
      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk

          ls -lh \
            android/app/build/outputs/apk/debug/app-debug.apk

      # ---------------------------------------------------------
      # UPLOAD APK
      # IMPORTANT: v4 - NOT v3
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cartcue-amazon-iap-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
