name: Build Android APK - CartCue Amazon IAP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CartCue
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Build Next.js app
        run: npm run build

      - name: Add Capacitor Android
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Amazon Appstore SDK
        shell: bash
        run: |
          set -e

          APP_GRADLE="android/app/build.gradle"
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -f "$APP_GRADLE"
          test -f "$MANIFEST"

          # Amazon Appstore SDK 3.0.9
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          dependency = "implementation 'com.amazon.device:amazon-appstore-sdk:3.0.9'"

          if dependency not in text:
              marker = "dependencies {"
              if marker not in text:
                  raise SystemExit(
                      "Could not find dependencies block in android/app/build.gradle"
                  )

              text = text.replace(
                  marker,
                  marker + "\n    " + dependency,
                  1
              )

          # Amazon submission/update version.
          # The original CartCue submission was versionCode 1.
          # This build uses versionCode 2.
          import re

          text, count = re.subn(
              r"versionCode\s+\d+",
              "versionCode 2",
              text,
              count=1
          )

          if count == 0:
              raise SystemExit(
                  "Could not find versionCode in android/app/build.gradle"
              )

          text, count = re.subn(
              r'versionName\s+"[^"]*"',
              'versionName "0.1.1"',
              text,
              count=1
          )

          if count == 0:
              raise SystemExit(
                  "Could not find versionName in android/app/build.gradle"
              )

          path.write_text(text)
          PY

          # Copy Amazon public key.
          mkdir -p android/app/src/main/assets
          test -f amazon-iap/AppstoreAuthenticationKey.pem
          cp amazon-iap/AppstoreAuthenticationKey.pem \
             android/app/src/main/assets/AppstoreAuthenticationKey.pem

          # Copy the native Capacitor Amazon IAP bridge.
          mkdir -p android/app/src/main/java/com/cartcue/app

          cp amazon-iap/AmazonIAPPlugin.java \
             android/app/src/main/java/com/cartcue/app/AmazonIAPPlugin.java

          cp amazon-iap/MainActivity.java \
             android/app/src/main/java/com/cartcue/app/MainActivity.java

      - name: Patch Android manifest for Amazon IAP
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = path.read_text()

          # Android 11+ package visibility required by Amazon.
          if "com.amazon.venezia" not in text:
              insert = """
          <queries>
              <package android:name="com.amazon.venezia" />
              <package android:name="com.amazon.sdktestclient" />
          </queries>
          """

              marker = "</manifest>"

              if marker not in text:
                  raise SystemExit(
                      "AndroidManifest.xml is missing </manifest>"
                  )

              text = text.replace(
                  marker,
                  insert + "\n" + marker,
                  1
              )

          # Amazon IAP notification permission.
          permission = (
              '<uses-permission '
              'android:name="com.amazon.inapp.purchasing.Permission.NOTIFY" />'
          )

          if permission not in text:
              marker = "<application"

              if marker not in text:
                  raise SystemExit(
                      "AndroidManifest.xml is missing <application>"
                  )

              text = text.replace(
                  marker,
                  permission + "\n\n    " + marker,
                  1
              )

          # Amazon ResponseReceiver.
          receiver = """
              <receiver
                  android:name="com.amazon.device.iap.ResponseReceiver"
                  android:exported="true"
                  android:permission="com.amazon.inapp.purchasing.Permission.NOTIFY">
                  <intent-filter>
                      <action android:name="com.amazon.inapp.purchasing.NOTIFY" />
                  </intent-filter>
              </receiver>
          """

          if "com.amazon.device.iap.ResponseReceiver" not in text:
              marker = "</application>"

              if marker not in text:
                  raise SystemExit(
                      "AndroidManifest.xml is missing </application>"
                  )

              text = text.replace(
                  marker,
                  receiver + "\n" + marker,
                  1
              )

          path.write_text(text)
          PY

      - name: Verify Amazon integration
        shell: bash
        run: |
          set -e

          test -f android/app/src/main/java/com/cartcue/app/AmazonIAPPlugin.java
          test -f android/app/src/main/java/com/cartcue/app/MainActivity.java
          test -f android/app/src/main/assets/AppstoreAuthenticationKey.pem

          grep -q "amazon-appstore-sdk:3.0.9" \
            android/app/build.gradle

          grep -q "com.amazon.device.iap.ResponseReceiver" \
            android/app/src/main/AndroidManifest.xml

          grep -q "com.amazon.venezia" \
            android/app/src/main/AndroidManifest.xml

          grep -q "com.amazon.sdktestclient" \
            android/app/src/main/AndroidManifest.xml

          grep -q "com.amazon.inapp.purchasing.Permission.NOTIFY" \
            android/app/src/main/AndroidManifest.xml

          echo "Amazon IAP configuration verified."

      - name: Build Android debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Verify APK exists
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Amazon test APK
        uses: actions/upload-artifact@v4
        with:
          name: cartcue-amazon-iap-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
