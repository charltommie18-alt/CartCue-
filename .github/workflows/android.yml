name: Build Android APK - CartCue Amazon IAP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CartCue
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Build Next.js app
        run: npm run build

      - name: Add Capacitor Android
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install Amazon Appstore SDK 3.0.9
        run: |
          mkdir -p android/app/libs
          curl -L --fail --retry 3 -o android/app/libs/amazon-appstore-sdk-3.0.9.jar https://repo1.maven.org/maven2/com/amazon/device/amazon-appstore-sdk/3.0.9/amazon-appstore-sdk-3.0.9.jar
          test -s android/app/libs/amazon-appstore-sdk-3.0.9.jar

      - name: Install Amazon authentication key
        run: |
          mkdir -p android/app/src/main/assets
          test -f amazon-iap/AppstoreAuthenticationKey.pem
          cp amazon-iap/AppstoreAuthenticationKey.pem android/app/src/main/assets/AppstoreAuthenticationKey.pem

      - name: Install CartCue Amazon IAP plugin
        run: |
          mkdir -p android/app/src/main/java/com/cartcue/app
          cp amazon-iap/AmazonIAPPlugin.java android/app/src/main/java/com/cartcue/app/AmazonIAPPlugin.java
          cp amazon-iap/MainActivity.java android/app/src/main/java/com/cartcue/app/MainActivity.java

      - name: Add Amazon SDK to Gradle
        run: |
          if ! grep -q "amazon-appstore-sdk-3.0.9.jar" android/app/build.gradle; then
            sed -i "s/dependencies {/dependencies {\\n    implementation files('libs\\/amazon-appstore-sdk-3.0.9.jar')/" android/app/build.gradle
          fi
          grep -n "amazon-appstore-sdk" android/app/build.gradle

      - name: Patch Android manifest for Amazon IAP
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "com.amazon.inapp.purchasing.Permission.NOTIFY" "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="com.amazon.inapp.purchasing.Permission.NOTIFY" \/>\n    <application/' "$MANIFEST"
          fi
          if ! grep -q "com.amazon.venezia" "$MANIFEST"; then
            sed -i 's/<application/<queries>\n        <package android:name="com.amazon.venezia" \/>\n        <package android:name="com.amazon.sdktestclient" \/>\n    <\/queries>\n    <application/' "$MANIFEST"
          fi
          if ! grep -q "com.amazon.device.iap.ResponseReceiver" "$MANIFEST"; then
            sed -i 's/<\/application>/        <receiver android:name="com.amazon.device.iap.ResponseReceiver" android:exported="true" android:permission="com.amazon.inapp.purchasing.Permission.NOTIFY"><intent-filter><action android:name="com.amazon.inapp.purchasing.NOTIFY" \/><\/intent-filter><\/receiver>\n    <\/application>/' "$MANIFEST"
          fi

      - name: Verify Amazon Android files
        run: |
          test -f android/app/src/main/java/com/cartcue/app/AmazonIAPPlugin.java
          test -f android/app/src/main/java/com/cartcue/app/MainActivity.java
          test -f android/app/libs/amazon-appstore-sdk-3.0.9.jar
          test -f android/app/src/main/assets/AppstoreAuthenticationKey.pem
          grep -q "com.amazon.device.iap.ResponseReceiver" android/app/src/main/AndroidManifest.xml
          grep -q "com.amazon.venezia" android/app/src/main/AndroidManifest.xml
          grep -q "com.amazon.sdktestclient" android/app/src/main/AndroidManifest.xml

      - name: Build Android debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Verify APK exists
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Amazon test APK
        uses: actions/upload-artifact@v4
        with:
          name: cartcue-amazon-iap-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
