<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CartCue</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f5f5f5;
      color: #111;
    }
    .card {
      max-width: 420px;
      margin: 40px auto;
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { color: #555; line-height: 1.5; margin: 8px 0; }
    a.button, button {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 18px;
      background: #ea580c;
      color: #fff;
      border: 0;
      border-radius: 10px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>CartCue</h1>
    <p>Turn product links into social-ready content kits.</p>
    <p id="status">Loading CartCue…</p>
    <p>
      <a class="button" id="openLink" href="https://cart-cue.vercel.app/">Open CartCue</a>
    </p>
  </div>
  <script>
    var TARGET = "https://cart-cue.vercel.app/";

    function go() {
      location.replace(TARGET);
    }

    document.getElementById("openLink").href = TARGET;
    document.getElementById("openLink").addEventListener("click", function (e) {
      e.preventDefault();
      go();
    });

    setTimeout(function () {
      document.getElementById("status").textContent = "Opening CartCue…";
      go();
    }, 600);
  </script>
</body>
</html>
